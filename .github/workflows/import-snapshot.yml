          REPO = 'mtgox700/mt-un'
          def fetch(c):
              req = urllib.request.Request(f'https://api.github.com/repos/{REPO}/git/blobs/{c["git_sha"]}', headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req, timeout=60) as response:
                          raw = base64.b64decode(json.load(response)['content'])
                      assert len(raw)==c['size'] and hashlib.sha256(raw).hexdigest()==c['sha256'], 'Chunk checksum mismatch'
                      return raw
                  except Exception:
                      if attempt==3: raise
                      time.sleep(2**attempt)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              archive = b''.join(pool.map(fetch, CHUNKS))
          assert hashlib.sha256(archive).hexdigest()=='f84ee27c915c7c64a3a739ff476ed46c66351a24ebdd1ab08f67956d4f3a434e'
          z = zipfile.ZipFile(io.BytesIO(archive))
          names=z.namelist()
          assert len(names)==4045 and len(names)==len(set(names))
          manifest=json.loads(z.read('REVIEW-MANIFEST.json'))['files']
          assert set(names)==set(manifest)|{'REVIEW-MANIFEST.json'}
          for name in names:
              p=pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts and '\\' not in name
              assert not z.getinfo(name).is_dir()
              data=z.read(name)
              if name in manifest:
                  assert len(data)==manifest[name]['bytes'] and hashlib.sha256(data).hexdigest()==manifest[name]['sha256'], name
          subprocess.run(['git','checkout','-b','review/s09-global'],check=True)
          subprocess.run(['git','read-tree','--empty'],check=True)
          index=bytearray()
          for name in names:
              # Workflow added afterwards using the connected GitHub integration.
              if name.startswith('.github/workflows/'):
                  continue
              data=z.read(name)
              sha=subprocess.check_output(['git','hash-object','-w','--stdin'],input=data).strip()
              index.extend(b'100644 '+sha+b'\t'+name.encode()+b'\0')
          subprocess.run(['git','update-index','-z','--index-info'],input=index,check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','Import verified uniion S09 review snapshot'],check=True,stdout=subprocess.DEVNULL)
