project_id = "uniion"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public", "api"]
extra_search_path = ["public", "extensions"]
max_rows = 500

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
otp_expiry = 900

[auth.mfa]
max_enrolled_factors = 4

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.sessions]
timebox = "12h"
inactivity_timeout = "2h"

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/app/custom_access_token_hook"

[auth.rate_limit]
sign_in_sign_ups = 10
token_verifications = 10

[storage]
enabled = true
file_size_limit = "80MiB"

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.sante]
verify_jwt = false

[functions.file-taches]
verify_jwt = false

[functions.desinscription]
verify_jwt = false

[functions.membres]
verify_jwt = false   # organisation.ouvrir s'authentifie par jeton d'éditeur ; les autres actions vérifient la session
