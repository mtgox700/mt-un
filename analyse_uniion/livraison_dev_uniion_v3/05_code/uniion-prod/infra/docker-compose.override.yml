# Surcharge du docker-compose officiel de Supabase (copiée dans /srv/uniion/supabase/).
# Nécessite Docker Compose ≥ 2.24 (balise !override).
services:
  kong:
    ports: !override
      - "127.0.0.1:8000:8000"   # Caddy seul est exposé ; Studio uniquement par tunnel SSH
  supavisor:
    ports: !override
      - "127.0.0.1:5432:5432"
      - "127.0.0.1:6543:6543"
  auth:
    environment:
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_EXP: "900"
      GOTRUE_PASSWORD_MIN_LENGTH: "12"
      GOTRUE_PASSWORD_REQUIRED_CHARACTERS: "abcdefghijklmnopqrstuvwxyz:ABCDEFGHIJKLMNOPQRSTUVWXYZ:0123456789:!@#$%^&*()_+-=[]{};'\\:\"|<>?,./`~"
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SESSIONS_TIMEBOX: "12h"
      GOTRUE_SESSIONS_INACTIVITY_TIMEOUT: "2h"
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      GOTRUE_MFA_MAX_ENROLLED_FACTORS: "4"
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: "true"
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: "pg-functions://postgres/app/custom_access_token_hook"
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "30"
      GOTRUE_MAILER_TEMPLATES_INVITE: "https://app.${DOMAINE}/emails/invitation.html"
      GOTRUE_MAILER_TEMPLATES_RECOVERY: "https://app.${DOMAINE}/emails/recuperation.html"
  rest:
    environment:
      PGRST_DB_SCHEMAS: "public,storage,graphql_public,api"
      PGRST_DB_MAX_ROWS: "500"
  functions:
    environment:
      SITE_URL: ${SITE_URL}
      AI_PROVIDER: ${AI_PROVIDER}
      AI_MODEL: ${AI_MODEL}
      AI_MODEL_ALIAS: ${AI_MODEL_ALIAS}
      AI_API_KEY: ${AI_API_KEY}
      QUOTA_IA_JOUR: ${QUOTA_IA_JOUR}
      COFFRE_CLE_MAITRE: ${COFFRE_CLE_MAITRE}
      SANTE_JETON: ${SANTE_JETON}
      FILE_JETON: ${FILE_JETON}
      OUVERTURE_JETON: ${OUVERTURE_JETON}
      BREVO_API_KEY: ${BREVO_API_KEY}
      EXPEDITEUR_EMAIL: ${EXPEDITEUR_EMAIL}
      EXPEDITEUR_NOM: ${EXPEDITEUR_NOM}
      CLAMAV_HOST: clamav
    depends_on:
      clamav:
        condition: service_healthy
    volumes:
      - ../functions:/home/deno/functions:Z   # supabase/functions du dépôt uniion (+ main/ du dépôt Supabase), déployé par la CI
  clamav:
    image: clamav/clamav:stable
    container_name: uniion-clamav
    restart: unless-stopped
    mem_limit: 3g          # ClamAV charge ses signatures en mémoire (~1,5 Go)
    volumes:
      - ./volumes/clamav:/var/lib/clamav:Z
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      retries: 5
      start_period: 300s
    # Aucun port publié : joignable uniquement depuis le réseau interne (Edge Functions).
  studio:
    environment:
      NEXT_PUBLIC_ENABLE_LOGS: "true"
