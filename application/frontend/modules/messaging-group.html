<sc-if value="{{ grm.open }}" hint-placeholder-val="{{ false }}">
  <div style="position: fixed; inset: 0; z-index: 86; background: hsl(var(--shC) / .62); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: 18px;">
    <div role="dialog" aria-modal="true" aria-label="{{ grm.title }}" style="width: 100%; max-width: 520px; max-height: 92vh; overflow: auto; background: var(--surface); border-radius: 24px; animation: scaleIn .22s ease-out; padding: 24px; display: flex; flex-direction: column; gap: 12px;">
      <h2 style="font-family: var(--fTitle); font-size: 22px; margin: 0 0 4px; color: var(--ink);">{{ grm.title }}</h2>
      <sc-if value="{{ grm.showDetails }}" hint-placeholder-val="{{ true }}"><label style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink6);">Nom du groupe</span><input value="{{ grm.name }}" onChange="{{ grm.onName }}" placeholder="Commission Égalité professionnelle" style="width: 100%; box-sizing: border-box; background: var(--surf2); border: 1px solid var(--bd2); border-radius: 12px; padding: 11px 13px; font-size: 13.5px; color: var(--ink); outline: none;" /></label>
      <label style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink6);">Description</span><textarea value="{{ grm.desc }}" onChange="{{ grm.onDesc }}" placeholder="Objet du groupe, règles d'échange…" style="width: 100%; box-sizing: border-box; background: var(--surf2); border: 1px solid var(--bd2); border-radius: 12px; padding: 11px 13px; font-size: 13.5px; color: var(--ink); outline: none; min-height: 70px; resize: vertical; line-height: 1.5;"></textarea></label>
      </sc-if>
      <sc-if value="{{ grm.notice }}" hint-placeholder-val="{{ false }}"><p style="font-size: 12px; color: var(--ink5); margin: 0;">{{ grm.notice }}</p></sc-if>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; justify-content: space-between; gap: 10px; align-items: baseline;"><span style="font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink6);">Membres</span><span style="font-size: 12px; font-weight: 700; color: var(--acTx2);">{{ grm.count }}</span></div>
        <sc-if value="{{ grm.hasChips }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-wrap: wrap; gap: 6px;">
            <sc-for list="{{ grm.chips }}" as="ch" hint-placeholder-count="3"><button onClick="{{ ch.rm }}" aria-label="Retirer" style="cursor: pointer; border: none; background: var(--acBg); color: var(--acTx); border-radius: 99px; padding: 5px 10px; font-size: 12px; font-weight: 600;">{{ ch.name }} ×</button></sc-for>
          </div>
        </sc-if>
        <div style="display: flex; align-items: center; gap: 9px; background: var(--surf2); border: 1px solid var(--bd2); border-radius: 12px; padding: 0 12px; color: var(--ink6);"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><input value="{{ grm.q }}" onChange="{{ grm.onQ }}" placeholder="{{ grm.searchPlaceholder }}" style="flex: 1; min-width: 0; border: none; background: transparent; outline: none; font-size: 13.5px; padding: 10px 0; color: var(--ink);" /></div>
        <div style="max-height: 280px; overflow-y: auto; border: 1px solid var(--bd); border-radius: 14px;">
          <sc-for list="{{ grm.cands }}" as="x" hint-placeholder-count="5">
            <button onClick="{{ x.toggle }}" aria-pressed="{{ x.on }}" style="width: 100%; text-align: left; cursor: pointer; display: flex; gap: 11px; align-items: center; background: transparent; border: none; border-bottom: 1px solid var(--bd); padding: 9px 12px; color: inherit;" style-hover="background: var(--surf2);">
              <span aria-hidden="true" style="width: 20px; height: 20px; flex: 0 0 20px; border-radius: 6px; border: 2px solid {{ x.boxBd }}; background: {{ x.boxBg }}; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{ x.check }}</span>
              <span aria-hidden="true" style="width: 34px; height: 34px; flex: 0 0 34px; border-radius: 99px; background: {{ x.avatarBg }}; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{ x.initials }}</span>
              <span style="flex: 1; min-width: 0;">
                <span style="display: block; font-size: 13.5px; font-weight: 600;">{{ x.name }}</span>
                <span style="display: block; font-size: 12px; color: var(--ink5); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ x.catLabel }} · {{ x.role }}</span>
              </span>
            </button>
          </sc-for>
        </div>
      </div>
      <sc-if value="{{ grm.error }}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 0; font-size: 12px; line-height: 1.5; color: var(--dangerTx2);">{{ grm.error }}</p></sc-if>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px;">
        <button onClick="{{ grm.close }}" style="margin-left: auto; cursor: pointer; border: 1px solid var(--bd2); background: var(--surface); border-radius: 99px; padding: 11px 16px; font-size: 13px; font-weight: 600; color: var(--ink4);">Annuler</button>
        <button onClick="{{ grm.save }}" style="cursor: pointer; border: none; border-radius: 99px; padding: 12px 20px; background: linear-gradient(to right, var(--ac), var(--ac2)); color: #FFFFFF; font-size: 13.5px; font-weight: 700;">{{ grm.saveLabel }}</button>
      </div>
    </div>
  </div>
</sc-if>
