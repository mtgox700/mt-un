<sc-if value="{{ isAdmin }}" hint-placeholder-val="{{ false }}">
        <div style="animation: fadeUp .45s ease-out;">
          <span style="background: var(--acBg); color: var(--acTx); font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 5px 11px; border-radius: 99px;">Back-office</span>
          <h1 style="font-family:var(--fTitle); font-size: 30px; margin: 12px 0 4px;">Tableau de bord organisation</h1>
          <p style="margin: 0 0 18px; color: var(--ink5); font-size: 14px;">{{ adminScope }}</p>

          <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px;">
            <sc-for list="{{ sites }}" as="si" hint-placeholder-count="4">
              <sc-if value="{{ si.selected }}" hint-placeholder-val="{{ false }}">
                <button onClick="{{ si.go }}" style="cursor: pointer; border: 1.5px solid var(--ac); background: var(--acBg); color: var(--acTx); border-radius: 99px; padding: 8px 15px; font-size: 12.5px; font-weight: 700;">{{ si.label }}</button>
              </sc-if>
              <sc-if value="{{ si.idle }}" hint-placeholder-val="{{ true }}">
                <button onClick="{{ si.go }}" style="cursor: pointer; border: 1px solid var(--bd2); background: var(--surface); color: var(--ink4); border-radius: 99px; padding: 8px 15px; font-size: 12.5px; font-weight: 600;" style-hover="border-color: var(--acMid); color: var(--acTx);">{{ si.label }}</button>
              </sc-if>
            </sc-for>
          </div>

          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 18px;">
            <sc-for list="{{ kpis }}" as="k" hint-placeholder-count="4">
              <div style="background: var(--surface); border: 1px solid var(--bd); border-radius: 20px; padding: 20px;">
                <div style="font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink6);">{{ k.label }}</div>
                <div style="font-family:var(--fTitle); font-size: 30px; margin: 8px 0 2px;">{{ k.value }}</div>
                <div style="font-size: 12px; color: {{ k.deltaColor }}; font-weight: 600;">{{ k.delta }}</div>
              </div>
            </sc-for>
          </div>

          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px;">
            <section style="background: var(--surface); border: 1px solid var(--bd); border-radius: 22px; padding: 22px;">
              <h2 style="font-family:var(--fTitle); font-size: 19px; margin: 0 0 16px;">Activité par commission</h2>
              <div style="display: flex; flex-direction: column; gap: 14px;">
                <sc-for list="{{ commissionStats }}" as="cs" hint-placeholder-count="4">
                  <div>
                    <div style="display: flex; justify-content: space-between; font-size: 13.5px; margin-bottom: 6px;">
                      <span style="font-weight: 600; color: var(--ink3);">{{ cs.label }}</span>
                      <span style="color: var(--ink5);">{{ cs.value }}</span>
                    </div>
                    <div style="height: 8px; border-radius: 99px; background: var(--chip); overflow: hidden;">
                      <div style="height: 100%; border-radius: 99px; background: linear-gradient(to right, var(--ac), var(--ac2)); width: {{ cs.width }};"></div>
                    </div>
                  </div>
                </sc-for>
              </div>
            </section>

            <section style="background: var(--inkSurf); border-radius: 22px; padding: 22px; color: #FFFFFF;">
              <h2 style="font-family:var(--fTitle); font-size: 19px; margin: 0 0 14px;">Raccourcis d'administration</h2>
              <div style="display: flex; flex-direction: column; gap: 10px;">
                <sc-for list="{{ adminLinks }}" as="al" hint-placeholder-count="4">
                  <button onClick="{{ al.go }}" style="cursor: pointer; text-align: left; border: 1px solid rgba(255, 255, 255, .14); background: rgba(255, 255, 255, .05); border-radius: 14px; padding: 14px 16px; color: #FFFFFF; display: flex; align-items: center; gap: 12px;">
                    <span style="flex: 1; min-width: 0;">
                      <span style="display: block; font-size: 14px; font-weight: 600;">{{ al.label }}</span>
                      <span style="display: block; font-size: 12px; color: var(--ink6); margin-top: 2px;">{{ al.meta }}</span>
                    </span>
                    <span style="color: var(--ink5);">›</span>
                  </button>
                </sc-for>
              </div>
            </section>
          </div>
        </div>
      </sc-if>
