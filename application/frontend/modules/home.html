<sc-if value="{{ isAccueil }}" hint-placeholder-val="{{ true }}">
        <div style="animation: fadeUp .45s ease-out;">
          <div style="font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--ink6); text-transform: uppercase;">Bonjour,</div>
          <h1 style="font-family:var(--fTitle); font-size: 34px; font-weight: 700; margin: 4px 0 2px;">{{ userName }}</h1>
          <p style="margin: 0 0 22px; color: var(--ink5); font-size: 14.5px;">{{ orgName }} · {{ openCount }} dossiers ouverts, {{ caseHomeHint }}</p>

          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 16px;">
            <button onClick="{{ goAccident }}" style="text-align: left; cursor: pointer; background: var(--surface); border: 1px solid var(--dangerBd2); border-radius: 20px; padding: 20px; box-shadow: 0 1px 2px hsl(var(--shC) / .04);" style-hover="box-shadow: 0 18px 40px -22px hsl(var(--shC) / .35);">
              <span style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
                <span style="background: var(--dangerBg); color: var(--danger); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 5px 11px; border-radius: 99px;">{{ caseHighlightLabel }}</span>
                <span style="font-size: 12px; color: var(--ink6);">{{ caseHighlightTime }}</span>
              </span>
              <span style="display: block; font-family:var(--fTitle); font-size: 20px; margin-bottom: 6px;">{{ caseHighlightTitle }}</span>
              <span style="display: block; font-size: 14px; color: var(--ink5); line-height: 1.55;">{{ caseHighlightBody }}</span>
            </button>

            <button onClick="{{ goNao }}" style="text-align: left; cursor: pointer; border: none; border-radius: 20px; padding: 20px; color: #FFFFFF; background: linear-gradient(135deg, var(--ac), var(--ac2)); box-shadow: 0 18px 40px -22px hsl(var(--acH) 85% 45% / .6);">
              <span style="display: block; font-size: 12.5px; opacity: .9; margin-bottom: 6px;">Sondage NAO en cours</span>
              <span style="display: block; font-family:var(--fTitle); font-size: 22px; margin-bottom: 16px;">Priorités salariales 2027</span>
              <span style="display: block; height: 7px; border-radius: 99px; background: rgba(255, 255, 255, .28); overflow: hidden;">
                <span style="display: block; width: 75%; height: 100%; background: var(--surface); border-radius: 99px;"></span>
              </span>
              <span style="display: block; text-align: right; font-size: 12.5px; font-weight: 700; margin-top: 8px;">75 % de participation</span>
            </button>
          </div>

          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 26px;">
            <sc-for list="{{ quickActions }}" as="qa" hint-placeholder-count="4">
              <button onClick="{{ qa.go }}" style="cursor: pointer; background: var(--surface); border: 1px solid var(--bd); border-radius: 18px; padding: 18px 14px; display: flex; flex-direction: column; align-items: center; gap: 9px;" style-hover="border-color: var(--acMid);">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--acTx)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ qa.d }}"></path><path d="{{ qa.d2 }}"></path></svg>
                <span style="font-size: 13px; font-weight: 600; color: var(--ink3);">{{ qa.label }}</span>
              </button>
            </sc-for>
          </div>

          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px;">
            <section style="background: var(--surface); border: 1px solid var(--bd); border-radius: 20px; padding: 20px;">
              <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px;">
                <h2 style="font-family:var(--fTitle); font-size: 19px; margin: 0;">Mes dossiers</h2>
                <button onClick="{{ goDossiers }}" style="border: none; background: transparent; color: var(--acTx); font-size: 12.5px; font-weight: 700; cursor: pointer;">Tout voir</button>
              </div>
              <div style="display: flex; flex-direction: column; gap: 10px;">
                <sc-for list="{{ homeDossiers }}" as="d" hint-placeholder-count="3">
                  <button onClick="{{ d.go }}" style="text-align: left; cursor: pointer; background: var(--surf2); border: 1px solid var(--bd); border-radius: 14px; padding: 13px 14px; display: flex; align-items: center; gap: 12px;" style-hover="border-color: var(--acMid); background: var(--surface);">
                    <span style="width: 8px; height: 8px; border-radius: 99px; flex: 0 0 8px; background: var(--ac);"></span>
                    <span style="flex: 1; min-width: 0;">
                      <span style="display: block; font-size: 14px; font-weight: 600;">{{ d.title }}</span>
                      <span style="display: block; font-size: 12px; color: var(--ink6); margin-top: 2px;">{{ d.meta }}</span>
                    </span>
                    <span style="color: var(--ink6);">›</span>
                  </button>
                </sc-for>
              </div>
            </section>

            <section style="background: var(--inkSurf); border-radius: 20px; padding: 22px; color: #FFFFFF;">
              <div style="font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink6);">Agenda partagé</div>
              <h2 style="font-family:var(--fTitle); font-size: 20px; margin: 8px 0 16px;">Prochaines échéances</h2>
              <div style="display: flex; flex-direction: column; gap: 12px;">
                <sc-for list="{{ agenda }}" as="ev" hint-placeholder-count="3">
                  <button onClick="{{ ev.go }}" style="cursor: pointer; width: 100%; text-align: left; background: transparent; border: none; border-top: 1px solid rgba(255, 255, 255, .1); border-radius: 0; padding: 12px 4px 0; display: flex; gap: 14px; align-items: center; color: #FFFFFF; transition: background .16s ease;" style-hover="background: rgba(255,255,255,.06);">
                    <div style="font-family:var(--fTitle); font-size: 15px; width: 58px; flex: 0 0 58px; color: var(--acMid);">{{ ev.date }}</div>
                    <div style="min-width: 0;">
                      <div style="font-size: 14px; font-weight: 600;">{{ ev.title }}</div>
                      <div style="font-size: 12px; color: var(--ink6); margin-top: 2px;">{{ ev.meta }}</div>
                    </div>
                    <span aria-hidden="true" style="margin-left: auto; color: var(--ink5); font-size: 15px;">›</span>
                  </button>
                </sc-for>
              </div>
            </section>
          </div>
        </div>
      </sc-if>
