<!-- ESPACE DOCUMENTS — ACCUEIL -->
      <sc-if value="{{ isDocs }}" hint-placeholder-val="{{ false }}">
        <div style="animation: fadeUp .45s ease-out;">
          <span style="background: var(--dangerBg); color: var(--danger); font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 5px 11px; border-radius: 99px;">Création de documents</span>
          <h1 style="font-family:var(--fTitle); font-size: 30px; margin: 13px 0 4px;">Documents</h1>
          <p style="margin: 0 0 18px; color: var(--ink5); font-size: 14px;">{{ docsSummary }}</p>

          <section style="background: var(--surface); border: 1px solid var(--bd); border-radius: 20px; padding: 18px 20px; margin-bottom: 26px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center;">
            <span style="width: 96px; height: 52px; flex: 0 0 auto; border: 1px dashed var(--bd2); border-radius: 12px; background: var(--surf2); display: flex; align-items: center; justify-content: center; overflow: hidden;">
              <sc-if value="{{ charteHasLogo }}" hint-placeholder-val="{{ false }}">
                <span role="img" aria-label="Logo par défaut des documents" style="{{ charteLogoSt }}"></span>
              </sc-if>
              <sc-if value="{{ charteNoLogo }}" hint-placeholder-val="{{ false }}">
                <span style="font-size: 10.5px; color: var(--ink6);">aucun</span>
              </sc-if>
            </span>
            <div style="flex: 1 1 260px; min-width: 0;">
              <h2 style="font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink5); margin: 0 0 5px;">Logo par défaut des documents</h2>
              <p style="margin: 0; font-size: 12.5px; color: var(--ink5); line-height: 1.55;">{{ docsLogoHint }}</p>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
              <label style="cursor: pointer; border: none; border-radius: 99px; padding: 10px 18px; background: var(--inkSurf); color: #FFFFFF; font-size: 12.5px; font-weight: 700; position: relative;">{{ docsLogoCta }}
                <input type="file" accept="image/*" onChange="{{ onLogoFile }}" style="position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden;" />
              </label>
              <sc-if value="{{ canUseBrandLogo }}" hint-placeholder-val="{{ false }}">
                <button onClick="{{ useBrandLogo }}" style="cursor: pointer; border: 1px solid var(--bd2); background: var(--surface); border-radius: 99px; padding: 10px 16px; font-size: 12.5px; font-weight: 600; color: var(--ink3);" style-hover="border-color: var(--acMid); color: var(--acTx);">Reprendre celui de la marque</button>
              </sc-if>
              <sc-if value="{{ charteHasLogo }}" hint-placeholder-val="{{ false }}">
                <button onClick="{{ clearLogo }}" style="cursor: pointer; border: none; background: transparent; padding: 8px 4px; font-size: 12px; font-weight: 600; color: var(--ink6);" style-hover="color: var(--danger);">Retirer</button>
              </sc-if>
            </div>
          </section>

          <h2 style="font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink5); margin: 0 0 12px;">Partir d'un modèle</h2>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(232px, 1fr)); gap: 14px; margin-bottom: 14px;">
            <sc-for list="{{ docModels }}" as="m" hint-placeholder-count="5">
              <button onClick="{{ m.create }}" style="text-align: left; cursor: pointer; background: var(--surface); border: 1px solid var(--bd); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 9px;" style-hover="border-color: var(--acMid); transform: translateY(-2px);">
                <span style="width: 34px; height: 34px; border-radius: 12px; background: var(--acBg); display: flex; align-items: center; justify-content: center;">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--acTx)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ m.d }}"></path><path d="{{ m.d2 }}"></path></svg>
                </span>
                <span style="font-size: 14.5px; font-weight: 700; color: var(--ink);">{{ m.label }}</span>
                <span style="font-size: 12.5px; color: var(--ink5); line-height: 1.55;">{{ m.desc }}</span>
                <span style="font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink6);">{{ m.meta }}</span>
              </button>
            </sc-for>
          </div>

          <button onClick="{{ goAiDoc }}" aria-label="Rédiger un document avec unii" style="width: 100%; text-align: left; cursor: pointer; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; background: var(--inkSurf); border: none; border-radius: 20px; padding: 18px 22px; margin-bottom: 30px;">
            <span style="display: flex; align-items: center; gap: 13px; min-width: 0;">
              <span aria-hidden="true" style="width: 32px; height: 32px; flex: 0 0 auto; border-radius: 11px; background: hsl(var(--acH) 90% 55% / .2); display: flex; align-items: center; justify-content: center;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--acOnDark)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"></path></svg>
              </span>
              <span style="min-width: 0;">
                <span style="display: block; font-size: 14.5px; font-weight: 700; color: #FFFFFF;">Rédiger avec unii</span>
                <span style="display: block; font-size: 12.5px; color: rgba(255,255,255,.72); margin-top: 3px; line-height: 1.5;">Décrivez votre document fictif ; unii prépare un brouillon enregistré, à relire dans l’éditeur.</span>
              </span>
            </span>
            <span style="font-size: 12.5px; font-weight: 700; color: var(--acMid);">Ouvrir →</span>
          </button>

          <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px;">
            <h2 style="font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink5); margin: 0;">Mes documents</h2>
            <span style="font-size: 12px; color: var(--ink6);">{{ docCountLabel }}</span><sc-if value="{{ openDocumentTrash }}"><button onClick="{{ openDocumentTrash }}" style="border:1px solid var(--bd2);background:var(--surface);border-radius:99px;padding:10px 15px;cursor:pointer;">Corbeille</button></sc-if>
          </div>
          <div style="display: flex; flex-direction: column; gap: 10px;">
            <sc-for list="{{ docList }}" as="dd" hint-placeholder-count="3">
              <div style="display: flex; flex-wrap: wrap; gap: 9px; align-items: center;">
              <button onClick="{{ dd.open }}" style="flex: 1 1 320px; min-width: 0; text-align: left; cursor: pointer; display: flex; flex-wrap: wrap; gap: 13px; align-items: center; background: var(--surface); border: 1px solid var(--bd); border-radius: 18px; padding: 15px 18px;" style-hover="border-color: var(--acMid);">
                <span aria-hidden="true" style="width: 32px; height: 40px; flex: 0 0 auto; border-radius: 5px; border: 1px solid var(--bd2); background: var(--surface); position: relative; overflow: hidden;">
                  <span style="position: absolute; left: 0; right: 0; top: 0; height: 7px; background: {{ dd.accent }};"></span>
                  <span style="position: absolute; left: 5px; right: 5px; top: 13px; height: 2px; border-radius: 2px; background: var(--track);"></span>
                  <span style="position: absolute; left: 5px; right: 11px; top: 19px; height: 2px; border-radius: 2px; background: var(--track);"></span>
                  <span style="position: absolute; left: 5px; right: 7px; top: 25px; height: 2px; border-radius: 2px; background: var(--track);"></span>
                </span>
                <span style="flex: 1; min-width: 160px;">
                  <span style="display: block; font-size: 14.5px; font-weight: 600; color: var(--ink);">{{ dd.title }}</span>
                  <span style="display: block; font-size: 12.5px; color: var(--ink5); margin-top: 3px;">{{ dd.meta }}</span>
                </span>
                <span style="font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 5px 11px; border-radius: 99px; background: {{ dd.pillBg }}; color: {{ dd.pillFg }};">{{ dd.status }}</span>
                <span aria-hidden="true" style="color: var(--ink6);">›</span>
              </button>
              <button onClick="{{ dd.del.act }}" style="flex: 0 0 auto; cursor: pointer; border: 1px solid var(--bd2); background: {{ dd.del.bg }}; color: {{ dd.del.fg }}; border-radius: 99px; padding: 10px 15px; font-size: 12px; font-weight: 600;" style-hover="border-color: var(--dangerBd2); color: var(--dangerTx2);">{{ dd.del.label }}</button>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-if>
